name: Build and Package WebApp

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create ZIP
        run: |
          cd dist
          zip -r ../webapp-dist.zip .

      - name: Upload dist folder
        uses: actions/upload-artifact@v4
        with:
          name: webapp-dist
          path: dist

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: webapp-dist-zip
          path: webapp-dist.zip
